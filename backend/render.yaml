services:
  - type: web
    name: wildfire-platform-api
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: JOB_TOKEN
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: RETENTION_DAYS
        value: "400"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FIRMS_SOURCES
        value: "VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT,MODIS_NRT"
      - key: DATAGOVIN_API_KEY
        sync: false
      - key: ENABLE_CPCB
        value: "false"
      - key: MODEL_DIR
        value: "models"
      - key: DEFAULT_COUNTRY
        value: "IN"
